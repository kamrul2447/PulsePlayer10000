# ── JVM ────────────────────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# ── Android ────────────────────────────────────────────────────────────────
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# ── Kotlin ─────────────────────────────────────────────────────────────────
kotlin.code.style=official

# ── Pulse Player build flags ───────────────────────────────────────────────
# Include the browser-only mock engine (web/js/mock) in the packaged assets.
# It is inert inside the app, but release builds can drop it with:
#   ./gradlew assembleRelease -PpulseWebMock=false
pulseWebMock=false

# ── Future advertisement system (architecture only — stays false) ──────────
# Keep false. When true, the (still empty) ad provider may be configured later
# from a remote endpoint — no ad SDK is included in this project.
pulseAdsEnabled=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Optional public Audius API key. Leave unset to keep online search disabled.
audiusApiKey=0x4c80a5e813b7556b3a39998d43c8d5f5e5fb4f1e
