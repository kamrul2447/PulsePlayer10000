<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b12">
  <meta name="color-scheme" content="dark light">
  <title>Pulse Player</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="splash" class="splash" aria-hidden="true">
    <div class="splash-ripple ripple-one"></div>
    <div class="splash-ripple ripple-two"></div>
    <div class="splash-ripple ripple-three"></div>
    <div class="splash-mark"><span class="pulse-mark">P</span></div>
    <div class="splash-name">PULSE<span>PLAYER</span></div>
    <div class="splash-caption">Find your frequency</div>
  </div>
  <div id="app" class="app-root">
    <noscript>Pulse Player needs JavaScript enabled to control local playback.</noscript>
  </div>
  <div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>
  <script src="js/core/bridge.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
