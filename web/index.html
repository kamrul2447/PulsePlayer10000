<!DOCTYPE html>
<!--
  Pulse Player — frontend shell (runs inside the Android WebView).
  Loaded by the app from https://pulse.local/index.html, intercepted by
  PulseWebViewClient and served from the APK assets folder.

  Load order matters: classic scripts (no ES modules) are used on purpose so the
  UI also works on older Android System WebView builds.
-->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0A0A0E">
<meta name="description" content="Pulse Player — a premium, offline-first music player for Android.">
<meta name="robots" content="noindex">
<title>Pulse Player</title>

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/library.css">
<link rel="stylesheet" href="css/player.css">
<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/premium.css">
</head>

<body class="booting">

<!-- ══════════════════ SPLASH ══════════════════ -->
<div id="splash" class="splash" role="status" aria-label="Loading Pulse Player">
  <div class="splash__mark">
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <defs>
        <linearGradient id="splashGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#8B5CF6"/>
          <stop offset="55%" stop-color="#7C3AED"/>
          <stop offset="100%" stop-color="#4C1D95"/>
        </linearGradient>
      </defs>
      <rect x="6" y="6" width="108" height="108" rx="32" fill="url(#splashGrad)"/>
      <g fill="#FFFFFF">
        <rect class="splash__bar" x="30"  y="52" width="7" height="16" rx="3.5"/>
        <rect class="splash__bar" x="43"  y="44" width="7" height="32" rx="3.5"/>
        <rect class="splash__bar" x="56"  y="34" width="7" height="52" rx="3.5"/>
        <rect class="splash__bar" x="69"  y="44" width="7" height="32" rx="3.5"/>
        <rect class="splash__bar" x="82"  y="52" width="7" height="16" rx="3.5"/>
      </g>
    </svg>
  </div>
  <div class="splash__word">Pulse Player</div>
  <div class="splash__status" id="splashStatus">Preparing your library…</div>
</div>

<!-- ══════════════════ APP ══════════════════ -->
<div id="app" class="app" aria-hidden="true">

  <!-- Top bar (contextual title + actions) -->
  <header class="appbar" id="appbar">
    <div class="appbar__titles">
      <h1 class="appbar__title" id="appbarTitle">Home</h1>
      <p class="appbar__subtitle" id="appbarSubtitle"></p>
    </div>
    <div class="appbar__actions" id="appbarActions"></div>
  </header>

  <main class="pages" id="pages">

    <!-- ─────────── HOME ─────────── -->
    <section class="page is-active" id="page-home" data-page="home" tabindex="-1">
      <div class="page__scroll" id="homeScroll"></div>
    </section>

    <!-- ─────────── LIBRARY ─────────── -->
    <section class="page" id="page-library" data-page="library" tabindex="-1">
      <div class="page__scroll" id="libraryScroll">
        <div class="filterbar" id="filterBar" role="tablist" aria-label="Library views"></div>
        <div class="library__body" id="libraryBody"></div>
      </div>
    </section>

    <!-- ─────────── SEARCH ─────────── -->
    <section class="page" id="page-search" data-page="search" tabindex="-1">
      <div class="page__scroll" id="searchScroll"></div>
    </section>

    <!-- ─────────── SETTINGS ─────────── -->
    <section class="page" id="page-settings" data-page="settings" tabindex="-1">
      <div class="page__scroll" id="settingsScroll"></div>
    </section>

  </main>

  <!-- ─────────── MINI PLAYER ─────────── -->
  <div class="mini" id="miniPlayer" role="button" tabindex="0" aria-label="Open now playing">
    <div class="mini__progress"><span id="miniProgressFill"></span></div>
    <div class="mini__art" id="miniArt"></div>
    <div class="mini__meta">
      <div class="mini__title" id="miniTitle">Nothing playing</div>
      <div class="mini__sub" id="miniSub">Pick a song to start</div>
    </div>
    <div class="mini__buttons">
      <button class="iconbtn iconbtn--ghost" id="miniPrev" aria-label="Previous track">
        <svg class="ico"><use href="#i-prev"/></svg>
      </button>
      <button class="iconbtn iconbtn--accent" id="miniPlay" aria-label="Play">
        <svg class="ico" id="miniPlayIcon"><use href="#i-play"/></svg>
      </button>
      <button class="iconbtn iconbtn--ghost" id="miniNext" aria-label="Next track">
        <svg class="ico"><use href="#i-next"/></svg>
      </button>
    </div>
  </div>


  <!-- ─────────── MAIN NAVIGATION ─────────── -->
  <nav class="nav" id="bottomNav" aria-label="Main navigation">
    <button class="nav__tab is-active" data-page="home" aria-label="Home">
      <svg class="ico"><use href="#i-home"/></svg><span>Home</span>
    </button>
    <button class="nav__tab" data-page="search" aria-label="Search">
      <svg class="ico"><use href="#i-search"/></svg><span>Search</span>
    </button>
    <button class="nav__tab" data-page="library" aria-label="Library">
      <svg class="ico"><use href="#i-library"/></svg><span>Library</span>
    </button>
    <button class="nav__tab" data-page="settings" aria-label="Settings">
      <svg class="ico"><use href="#i-settings"/></svg><span>Settings</span>
    </button>
    <div class="nav__indicator" id="navIndicator"></div>
  </nav>


</div>

<!-- ══════════════════ FULL PLAYER ══════════════════ -->
<div class="player" id="fullPlayer" role="dialog" aria-modal="true" aria-label="Now playing" aria-hidden="true">
  <div class="player__bg" id="playerBg"></div>
  <div class="player__scrim"></div>

  <div class="player__inner">
    <div class="player__grab" id="playerGrab"><span></span></div>

    <header class="player__head">
      <button class="iconbtn iconbtn--ghost" id="playerClose" aria-label="Close player">
        <svg class="ico"><use href="#i-chevron-down"/></svg>
      </button>
      <div class="player__headlabel">
        <span class="player__kicker" id="playerKicker">Now playing</span>
        <span class="player__album" id="playerAlbum"></span>
      </div>
      <button class="iconbtn iconbtn--ghost" id="playerQueue" aria-label="Queue">
        <svg class="ico"><use href="#i-queue"/></svg>
      </button>
    </header>

    <div class="player__artwrap">
      <div class="player__art" id="playerArt">
        <img id="playerArtImg" alt="" hidden>
        <div class="player__artfallback" id="playerArtFallback"><svg class="ico"><use href="#i-note"/></svg></div>
      </div>
    </div>

    <div class="player__meta">
      <div class="player__text">
        <h2 class="player__title" id="playerTitle">Nothing playing</h2>
        <p class="player__artist" id="playerArtist">Unknown artist</p>
      </div>
      <button class="iconbtn iconbtn--fav" id="playerFav" aria-label="Toggle favourite" aria-pressed="false">
        <svg class="ico" id="playerFavIcon"><use href="#i-heart"/></svg>
      </button>
    </div>

    <div class="player__progress">
      <div class="seek" id="seekTrack">
        <div class="seek__buffer" id="seekBuffer"></div>
        <div class="seek__fill" id="seekFill"></div>
        <div class="seek__thumb" id="seekThumb"></div>
      </div>
      <div class="seek__times">
        <span id="timeCurrent">0:00</span>
        <span id="timeRemaining">-0:00</span>
      </div>
    </div>

    <div class="player__controls">
      <button class="playerbtn" id="btnShuffle" aria-label="Shuffle" aria-pressed="false">
        <svg class="ico"><use href="#i-shuffle"/></svg>
      </button>
      <button class="playerbtn" id="btnPrev" aria-label="Previous">
        <svg class="ico"><use href="#i-prev"/></svg>
      </button>
      <button class="playbtn" id="btnPlay" aria-label="Play">
        <svg class="ico" id="btnPlayIcon"><use href="#i-play"/></svg>
      </button>
      <button class="playerbtn" id="btnNext" aria-label="Next">
        <svg class="ico"><use href="#i-next"/></svg>
      </button>
      <button class="playerbtn" id="btnRepeat" aria-label="Repeat" aria-pressed="false">
        <svg class="ico" id="btnRepeatIcon"><use href="#i-repeat"/></svg>
      </button>
    </div>

    <div class="player__footer">
      <button class="pillbtn" id="btnSleep">
        <svg class="ico"><use href="#i-timer"/></svg><span id="sleepPillLabel">Sleep</span>
      </button>
      <button class="pillbtn" id="btnVolumeToggle" aria-label="Volume">
        <svg class="ico" id="volIcon"><use href="#i-volume-high"/></svg>
      </button>
      <div class="volume" id="volumeRow" hidden>
        <svg class="ico ico--sm"><use href="#i-volume-low"/></svg>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1" aria-label="Volume">
        <span class="volume__val" id="volumeValue">100</span>
      </div>
    </div>
  </div>
</div>

<!-- ══════════════════ SHEETS / TOAST / ONBOARDING ══════════════════ -->
<div class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet__backdrop" id="sheetBackdrop"></div>
  <div class="sheet__panel" id="sheetPanel" role="dialog" aria-modal="true">
    <div class="sheet__grab"><span></span></div>
    <div class="sheet__head" id="sheetHead"></div>
    <div class="sheet__body" id="sheetBody"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="onboarding" id="onboarding" hidden>
  <div class="onboarding__card" id="onboardingCard"></div>
</div>

<!-- ══════════════════ ICON SPRITE ══════════════════ -->

</body>
</html>
